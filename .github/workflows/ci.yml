name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (with dev + api extras)
        run: pip install -e ".[dev,api]"
      - name: Lint — ruff
        run: ruff check .
      - name: Type-check the core engine — mypy
        run: mypy
      - name: Tests — pytest (incl. exact-DP brute-force checks)
        run: pytest -q

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Transfer DP vs brute force (in-browser engine)
        run: node tests/test_transfer_js.mjs
