name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  optimizer-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy
      - name: Exact squad DP vs brute force
        run: python tests/test_optimizer.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Transfer DP vs brute force (JS engine)
        run: node tests/test_transfer_js.mjs
