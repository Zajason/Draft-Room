[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eldraft"
version = "0.1.0"
description = "Advanced-analytics squad building for the EuroLeague Fantasy Challenge — projections, an exact optimiser, an MCTS draft lookahead, and a weekly transfer engine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zajason" }]
keywords = ["basketball", "euroleague", "fantasy", "optimization", "mcts", "sports-analytics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "requests>=2.28",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["ruff>=0.4", "mypy>=1.8", "pytest>=8.0", "httpx>=0.27"]

[project.scripts]
eldraft = "eldraft.cli:main"

[project.urls]
Homepage = "https://github.com/Zajason/Draft-Room"
Repository = "https://github.com/Zajason/Draft-Room"

[tool.setuptools]
packages = ["eldraft"]

[tool.setuptools.package-data]
eldraft = ["*.html", "web/*"]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# Bug-catching, not style policing: pyflakes (F), import order (I), and the
# correctness-oriented pycodestyle groups. Opinionated rewrites (UP/RUF/B) are left off.
select = ["E4", "E7", "E9", "F", "I", "W"]
# E402: deferred imports are deliberate in a few CLI paths.
# E701/E702/E731/E741: compact one-liners and local lambdas are a deliberate style choice
# in the numeric/DP code; ruff still enforces the bug-catching F/I/W/E9 rules.
ignore = ["E402", "E701", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E7"]    # compact multi-statement asserts in the brute-force harnesses

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = false
# Static type-checking is gated on the core engine — the data, projection, pricing,
# scouting and optimisation modules. The numpy-heavy simulation kernels (MCTS, draft/
# season sims, the FastAPI glue) use dynamic array code that mypy can't usefully check
# without heavy annotation for little safety gain, so they are run but not gated.
files = [
    "eldraft/optimize.py",
    "eldraft/config.py",
    "eldraft/names.py",
    "eldraft/pricing.py",
    "eldraft/excel_io.py",
    "eldraft/weekly.py",
    "eldraft/ratings.py",
    "eldraft/fetch.py",
]

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
